# =====================================================================
# CI da API da GS (snapshot do Java no repositório de DevOps)
#
# Dispara a cada commit na main. A main só recebe merges de pull request,
# por causa da política de branch, então o CI roda depois de cada merge, e:
#   1. compila, roda os testes automatizados e empacota o .jar;
#   2. publica o resultado dos testes na aba "Tests" da execução;
#   3. publica o .jar como artefato "gs-jar" no Azure DevOps.
#
# O CD é a Release clássica "gs-cd": ela tem o gatilho de implantação
# contínua ligado a este artefato e publica o .jar no Azure Web App
# sempre que uma execução desta pipeline termina.
#
# Nenhum segredo passa por aqui: os testes que precisam de banco têm a
# tag JUnit "integracao" e ficam de fora no CI (-DexcludedGroups).
#
# Sem Cache@2: nesta organização a task falha antes de rodar com
# "Value cannot be null. Parameter name: securityNamespace"
# (microsoft/azure-pipelines-tasks#11291).
# =====================================================================

trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

# Variáveis da pipeline: nome do artefato e opções do Maven.
# Os segredos da aplicação ficam no variable group gs-segredos, usado só pela Release.
variables:
  artefato: gs-jar
  opcoesMaven: -B -DexcludedGroups=integracao

stages:
  - stage: CI
    displayName: CI - build, testes e artefato
    jobs:
      - job: build
        displayName: Build e testes (Maven, JDK 21)
        steps:
          - task: Maven@4
            displayName: Compilar, testar e empacotar
            inputs:
              mavenPOMFile: pom.xml
              goals: clean package
              options: $(opcoesMaven)
              javaHomeOption: Path
              jdkDirectory: $(JAVA_HOME_21_X64)
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: Testes automatizados da API da GS

          - task: CopyFiles@2
            displayName: Separar o .jar executável
            inputs:
              SourceFolder: target
              Contents: '*.jar'
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishPipelineArtifact@1
            displayName: Publicar o artefato gs-jar
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: $(artefato)
              publishLocation: pipeline
